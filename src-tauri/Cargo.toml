[package]
name = "piecepool"
version = "0.1.0" # x-release-please-version
description = "PiecePool — local-first AI knowledge workspace"
authors = ["PiecePool"]
edition = "2021"
license-file = "../LICENSE"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "piecepool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
pdf-extract = "0.10.0"

# Windows 탐색기는 닷 이름(`.config`)을 숨기지 않는다 — SetFileAttributesW 로 숨김 속성을 건다.
# 0.61 은 tauri 의존 그래프(muda 등)에 이미 들어 있는 메이저라 빌드 부담이 없다.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

# dev(tauri dev) 빌드는 opt-level 0 기본값이라 PDF 텍스트 추출(CPU-bound)이
# 릴리즈 대비 수~수십 배 느리다. 핫패스 크레이트(파서·압축 해제·텍스트 디코딩)만
# 최적화한다 — "*" 블랭킷은 CI cargo test·콜드 빌드를 2배로 늘려 되돌렸다(#212 회고).
# dev 임포트가 다시 느려지면 이 목록에 크레이트를 선별 추가할 것.
[profile.dev.package.pdf-extract]
opt-level = 2

[profile.dev.package.lopdf]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.crc32fast]
opt-level = 2

[profile.dev.package.weezl]
opt-level = 2

[profile.dev.package.encoding_rs]
opt-level = 2

