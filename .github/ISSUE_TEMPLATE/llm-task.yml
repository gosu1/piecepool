name: LLM Task
description: LLM 어댑터/프롬프트/검증 작업 (OpenAI)
title: "[LLM] "
labels: ["role:llm"]
body:
  - type: markdown
    attributes:
      value: |
        LLM 작업 이슈. 시작 전 `docs/00-overview/`, `docs/10-contracts/`, `docs/30-llm/` 필독.
        환경변수: `OPENAI_API_KEY`, `PIECEPOOL_LLM_MODEL`.

  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - Phase 3 (Overview)
        - Phase 4 (Roles)
        - Phase 5 (QA & Roadmap)
        - 범위 외
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: 대상 Provider
      options:
        - openai
        - N/A
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 검증 가능한 성공 기준
      placeholder: "예: OpenAI provider adapter 구현, LlmWikiResult 스키마 출력(strict) 통과"
    validations:
      required: true

  - type: textarea
    id: schema-impact
    attributes:
      label: LLM 출력 schema 영향
      description: `docs/10-contracts/llm-output-schema.md` 수정 동반 여부
      placeholder: "예: confusingConcepts 필드 추가 — SSOT 변경"

  - type: textarea
    id: eval
    attributes:
      label: 검증/eval 방법
      placeholder: "예: docs/30-llm/evals.md 골든 케이스 3건 통과"
    validations:
      required: true
