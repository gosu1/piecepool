name: release

# release-please가 만든 v* tag push에 반응해 데스크톱 번들을 빌드하고 Release에 첨부한다.
#  - macOS: universal 바이너리(.dmg) — Apple Silicon + Intel 한 파일
#  - Windows: .msi / .exe (NSIS)
# workflow_dispatch: tag 없이 수동 실행하면 Release 대신 Actions 아티팩트로 업로드된다
# (경진대회 제출 등 릴리스 밖 배포용 — 태그를 남기지 않고 설치 파일만 받아 간다).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Tauri build
        # (선택) 데모용 Gemini 키 주입 — 리포지토리 Secret VITE_GEMINI_API_KEY 가 있으면 번들에 박힌다.
        # Secret 미설정이면 빈 값 → 앱은 설정 모달 입력/휴리스틱 폴백으로 동작(무해). 소스엔 키가 남지 않는다.
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: npm run tauri build -- ${{ matrix.args }}
      # 태그 빌드 → GitHub Release 에 첨부
      - name: Attach bundle to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
      # 수동 실행(workflow_dispatch) → 태그 없이 Actions 아티팩트로 업로드(제출용)
      - name: Upload artifact (수동 실행)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
