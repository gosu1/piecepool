name: Docs Check

# ssot-check 가 CLAUDE.md·소스까지 스캔하므로 트리거도 같이 넓힌다.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'src/**'
      - 'src-tauri/src/**'
      - 'scripts/ssot-check.mjs'
      - 'scripts/ssot-baseline.json'
      - '.github/workflows/docs-check.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'src/**'
      - 'src-tauri/src/**'
      - 'scripts/ssot-check.mjs'
      - 'scripts/ssot-baseline.json'
      - '.github/workflows/docs-check.yml'

jobs:
  link-check:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lychee (offline, internal links only)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --offline
            'docs/**/*.md'
            'README.md'
          fail: true

  ssot-check:
    name: SSOT guard (10-contracts is single source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 종전 grep 3종은 실제 복붙을 0건 잡았다 (백틱 미대응·CLAUDE.md 누락·warning 뿐).
      # 검사 로직·베이스라인 래칫은 scripts/ssot-check.mjs 참조. 새 위반 = 실패.
      - name: SSOT leakage check (docs + CLAUDE.md + src)
        run: node scripts/ssot-check.mjs

  prettier:
    name: Prettier check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Prettier --check (markdown)
        run: |
          npx --yes prettier@3 --check \
            'docs/**/*.md' \
            'README.md' \
            || echo "::warning::Prettier formatting suggestions exist. 본 job는 advisory, blocking 아님"
