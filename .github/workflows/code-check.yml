name: code-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # 아래는 안정화 전까지 continue-on-error, green 확인 후 blocking 전환
      - name: npm test (vitest)
        continue-on-error: true
        run: npm test
      - name: gen:types drift guard
        continue-on-error: true
        run: |
          npm run gen:types
          git diff --exit-code src/lib/generated

  rust:
    # Tauri(wry/webkit) 의존으로 macOS 유지 — bare ubuntu 금지
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      # 아래 3개는 안정화 전까지 continue-on-error, green 확인 후 blocking 전환
      - name: cargo test
        continue-on-error: true
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
