name: code-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check # 앱(tsconfig.json) + CLI 스크립트(tsconfig.scripts.json)
      - run: npm run build
      # 타입만으론 못 잡는 배관(픽스처 경로·CLI 인자)을 키 없이 실제 실행해 확인한다.
      - name: scripts smoke (offline, no API key)
        run: npm run chunk -- --text "커널은 자원을 관리한다. 프로세스는 실행 중인 프로그램이다." --offline
      # 아래는 안정화 전까지 continue-on-error, green 확인 후 blocking 전환
      - name: npm test (vitest)
        continue-on-error: true
        run: npm test
      # e2e 는 blocking — 여기가 continue-on-error 였다면 셀렉터가 썩어도 아무도 모른다.
      - name: e2e (playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  rust:
    # macOS 러너는 분 차감 10배라 무료 한도(월 2,000분)를 1주에 소진한다.
    # Tauri(wry/webkit) 링크는 아래 apt 의존성으로 해결 — 이 목록 없는 bare ubuntu 는 여전히 금지.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Tauri v2 공식 Ubuntu prerequisites
      - name: install tauri linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      # 아래 3개는 안정화 전까지 continue-on-error, green 확인 후 blocking 전환
      - name: cargo test
        continue-on-error: true
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      # gen:types 는 cargo test(export_bindings) 실행이라 rust 잡에 둔다 —
      # frontend 잡에 두면 Tauri 네이티브 의존성 설치와 크레이트 재컴파일이 통째로 필요해진다.
      - name: gen:types drift guard
        continue-on-error: true
        run: |
          npm run gen:types
          git diff --exit-code src/lib/generated
