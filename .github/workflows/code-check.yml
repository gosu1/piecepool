name: code-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    # 2026-08-23 ubuntu 전환 (PIE-75). Rust 의존 스텝(드리프트 가드)을 rust 잡으로 옮겨 순수 Node 잡이 됐다.
    # macOS 동시 실행 한도(5개)에 frontend 가 끼지 않게 한다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check # 앱(tsconfig.json) + CLI 스크립트(tsconfig.scripts.json)
      - run: npm run build
      # 타입만으론 못 잡는 배관(픽스처 경로·CLI 인자)을 키 없이 실제 실행해 확인한다.
      - name: scripts smoke (offline, no API key)
        run: npm run chunk -- --text "커널은 자원을 관리한다. 프로세스는 실행 중인 프로그램이다." --offline
      # 2026-08-07 blocking 전환 (PIE-5). 로컬 실측 전부 초록 확인 후 전환했다.
      - name: npm test (vitest)
        run: npm test
      # e2e 는 blocking — 여기가 continue-on-error 였다면 셀렉터가 썩어도 아무도 모른다.
      # CI 에서는 위 build 결과를 그대로 preview 한다(playwright.config.ts 의 CI 분기) — 재빌드 없음.
      # chromium 캐시(actions/cache)는 실측 결과 복원 5초 = 다운로드 5초라 효과 0이어서 두지 않는다 (PIE-75).
      - name: e2e (playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  rust:
    # Tauri(wry/webkit) 의존으로 macOS 유지 — bare ubuntu 금지
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      # 2026-08-07 blocking 전환 (PIE-5). 로컬 실측 전부 초록 확인 후 전환했다.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      # 생성물 최신 검사 — 바로 위 cargo test 가 export_bindings 로 src/lib/generated 를 다시 쓴다.
      # models/ 를 고치고 gen:types 를 잊으면 커밋본과 달라져 여기서 잡힌다. (2026-08-23 frontend 에서 이사, PIE-75)
      - name: gen:types drift guard
        run: git diff --exit-code src/lib/generated
